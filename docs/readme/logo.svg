<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none" role="img" aria-label="Lulu Dialogue Skills">
  <defs>
    <linearGradient id="tile" x1="40" y1="28" x2="200" y2="212" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2a2a2e"/>
      <stop offset="1" stop-color="#141416"/>
    </linearGradient>
    <linearGradient id="sheet" x1="56" y1="52" x2="184" y2="188" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef0f4"/>
    </linearGradient>
    <linearGradient id="accent" x1="96" y1="72" x2="176" y2="160" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <ellipse cx="120" cy="208" rx="72" ry="10" fill="#000000" opacity="0.18"/>
  <rect x="36" y="28" width="168" height="168" rx="40" fill="url(#tile)" filter="url(#soft)"/>
  <rect x="56" y="52" width="128" height="120" rx="24" fill="url(#sheet)"/>

  <!-- reply (left, quieter) -->
  <rect x="70" y="108" width="52" height="36" rx="14" fill="#1d1d1f" opacity="0.18"/>
  <path d="M82 144l-6 10 16-8" fill="#1d1d1f" opacity="0.18"/>
  <rect x="80" y="118" width="28" height="5" rx="2.5" fill="#1d1d1f" opacity="0.28"/>
  <rect x="80" y="128" width="20" height="5" rx="2.5" fill="#1d1d1f" opacity="0.18"/>

  <!-- ask (right, accent) -->
  <rect x="108" y="70" width="62" height="42" rx="16" fill="url(#accent)"/>
  <path d="M154 112l8 12-18-6" fill="#1d4ed8"/>
  <rect x="120" y="82" width="34" height="6" rx="3" fill="#ffffff" opacity="0.92"/>
  <rect x="120" y="94" width="24" height="6" rx="3" fill="#ffffff" opacity="0.45"/>
</svg>
